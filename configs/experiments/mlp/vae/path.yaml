experiment_name: mlp_vae_path

data:
  img_size: 28  # override pathmnist default (224) — MLP works on flat 28x28

model:
  model_type: mlp_vae
  latent_dim: 256
  hidden_dim: 1024
  depth: 5

training:
  epochs: 200
  lr: 1.0e-4
  optimizer: adamw
  weight_decay: 1.0e-5
  scheduler: cosine
  warmup_epochs: 25
  kl_weight: 1.0e-3
  kl_warmup_epochs: 50
  early_stopping: true
  early_stopping_patience: 25

ood:
  primary_score: elbo
  knn_k: 5

wandb:
  tags: [ood, mlp_vae, pathmnist]
  save_code: false
