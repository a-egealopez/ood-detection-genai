experiment_name: unet_ddpm

model:
  model_type: unet_ddpm
  img_size: 28
  channels: [64, 128, 256]
  attention_levels: [false, false, false]
  num_head_channels: [0, 0, 64]
  num_res_blocks: 1
  num_train_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon
  clip_sample: true
  n_score_steps: 5
  recon_timestep: 100
  noise_timestep: 100

data:
  flat: false

training:
  batch_size: 16
  epochs: 300
  lr: 1.0e-4
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 30
  use_ema: true
  early_stopping: true
  early_stopping_patience: 15

ood:
  primary_score: noise_single
  knn_k: 1

evaluation:
  eval_batch_size: 8
  n_train_ref_samples: 5000

wandb:
  tags: [ood, unet_ddpm]
  save_code: false
