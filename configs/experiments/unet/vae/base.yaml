experiment_name: unet_vae

model:
  model_type: unet_vae
  img_size: 28
  latent_channels: 4
  channels: [32, 64, 128]
  num_res_blocks: 1

data:
  flat: false

training:
  epochs: 150
  lr: 1.0e-4
  optimizer: adamw
  weight_decay: 1.0e-5
  scheduler: cosine
  warmup_epochs: 25
  kl_weight: 1.0e-3
  kl_warmup_epochs: 30
  early_stopping: true
  early_stopping_patience: 40

ood:
  primary_score: elbo
  knn_k: 5

wandb:
  tags: [ood, unet_vae]
  save_code: false
