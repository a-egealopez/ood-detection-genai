experiment_name: ddpm_toy

model:
  model_type: ddpm
  hidden_dim: 64
  depth: 2
  time_emb_dim: 64
  dropout: 0.0
  num_train_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon
  n_score_steps: 10
  recon_timestep: 150
  noise_timestep: 150

training:
  lr: 1.0e-3
  epochs: 100
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 10
  use_ema: true
  early_stopping: true
  early_stopping_patience: 30

ood:
  primary_score: noise_single
  knn_k: 1

wandb:
  tags: [ood, ddpm, toy]
  save_code: false
