seed: 42
experiment_name: ???

training:
  epochs: 200
  batch_size: 256
  lr: 1.0e-3
  optimizer: adam
  scheduler: none
  warmup_epochs: 0
  min_lr: 1.0e-6
  grad_clip: 1.0
  use_ema: false
  ema_decay: 0.999
  validate_every_n_epochs: 1
  early_stopping: false
  early_stopping_patience: 20
  early_stopping_min_delta: 0.0
  viz_every_n_epochs: 50
  checkpoint_dir: results/training/${experiment_name}/checkpoints/

wandb:
  enabled: true
  project: tfg-ood-diffusion
  entity: null
  run_name: ${experiment_name}
  tags: [ood]
  save_code: false
  log_frequency: 10

viz:
  plots_dir: results/evaluation/${experiment_name}/plots/
  train_plots_dir: results/training/${experiment_name}/plots/
  eval_plots_dir: results/evaluation/${experiment_name}/plots/
  # publication-friendly width in inches (approx. \textwidth)
  textwidth_in: 6.0
  # DPI to use for final saved PNGs
  savefig_dpi: 300
  recon_n_samples: 2
  ddpm_timestep_grid_mode: compact
  ddpm_denoising_trajectory_mode: compact
  projectors: [pca, umap]
  pca_n_components: 50
  tsne_perplexity: 30
  umap_n_neighbors: 15
  umap_min_dist: 0.1
  umap_metric: euclidean
  umap_pca_init_components: 50

evaluation:
  results_dir: results/evaluation/${experiment_name}/